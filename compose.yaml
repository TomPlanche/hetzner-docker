# Production stack of the Hetzner VPS.
#
# Caddy runs on the host (caddy/) and proxies to the ports below, which listen
# on 127.0.0.1 only. Test this stack locally with `just local-up`, which adds
# compose.local.yaml on top of this file.
#
# Not in git: env/*.env (secrets, see env/*.env.example), data/ (mounted
# files), src/ (the sources of the images, cloned by `just init`).

name: hetzner

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  vps-back:
    image: tomplanche/vps-back:main
    build:
      context: src/vps-back
      dockerfile: ../../images/vps-back/Dockerfile
    ports:
      - 127.0.0.1:8000:8000
    env_file: env/vps-back.env
    # These values win over the env file.
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      STATIC_DIR: /data/static
    volumes:
      # Served under /static/ (api.tomplanche.com/static/). Writable: vps-back
      # writes github-stats.json in it.
      - ./data/vps-back/static:/data/static
    restart: unless-stopped
    logging: *logging

  site:
    image: tomplanche/portfolio:main
    build:
      context: src/site
      dockerfile: ../../images/portfolio/Dockerfile
      args:
        COMMIT_SHA: ${SITE_COMMIT_SHA:-}
        COMMIT_DATE: ${SITE_COMMIT_DATE:-}
        COMMIT_URL: ${SITE_COMMIT_URL:-}
    ports:
      - 127.0.0.1:3000:3000
    env_file: env/site.env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - ./data/fonts:/app/build/client/fonts:ro
    restart: unless-stopped
    logging: *logging

  next-site:
    image: tomplanche/portfolio:next
    build:
      context: src/next-site
      dockerfile: ../../images/portfolio/Dockerfile
      args:
        COMMIT_SHA: ${NEXT_COMMIT_SHA:-}
        COMMIT_DATE: ${NEXT_COMMIT_DATE:-}
        COMMIT_URL: ${NEXT_COMMIT_URL:-}
    ports:
      - 127.0.0.1:3001:3000
    # The env of site, then the values that differ for next-site (MAINTENANCE,
    # for example). A later file wins over an earlier one.
    env_file:
      - env/site.env
      - path: env/next-site.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - ./data/fonts:/app/build/client/fonts:ro
    restart: unless-stopped
    logging: *logging

  atkuzu:
    image: tomplanche/atkuzu:main
    build:
      context: src/atkuzu
      dockerfile: ../../images/atkuzu/Dockerfile
      target: app
    ports:
      - 127.0.0.1:3002:3000
    env_file: env/atkuzu.env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: /data/atkuzu.db
      # The dailies that atkuzu-daily writes: the app serves them from here.
      DAILY_DIR: /data/daily
      # Behind Caddy: the public URL of a request (for the OAuth login and the
      # check of form origins) comes from the X-Forwarded-* headers of Caddy.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    volumes:
      # The SQLite database (the OAuth sessions and state) and daily/.
      - ./data/atkuzu:/data
    restart: unless-stopped
    logging: *logging

  # A one-shot job, not a server: `just publish-daily` (or
  # `docker compose run --rm atkuzu-daily`) writes the missing dailies of
  # atkuzu into data/atkuzu/daily, which the app serves. Run it every hour.
  atkuzu-daily:
    image: tomplanche/atkuzu-daily:main
    build:
      context: src/atkuzu
      dockerfile: ../../images/atkuzu/Dockerfile
      target: daily
    profiles: [tools]
    env_file: env/atkuzu-daily.env
    volumes:
      - ./data/atkuzu/daily:/app/static/daily
    logging: *logging

  # A one-shot job, not a server: `just publish-sifa` (or
  # `docker compose run --rm sifa-page`) rebuilds the page into /var/www.
  sifa-page:
    image: tomplanche/sifa-page:main
    build:
      context: src/sifa-page
      dockerfile: ../../images/sifa-page/Dockerfile
    profiles: [tools]
    environment:
      SIFA_ID: did:plc:ybx6os5vaaksppbxwvqqciaf
    volumes:
      - /var/www/sifa-page:/out
    logging: *logging

  # Beszel: a dashboard of the resources (CPU, RAM, disk, network) of the host
  # and of each container, with history and alerts. The hub holds the web UI and
  # the history. The agent reads the host and Docker, and sends to the hub.
  beszel:
    image: henrygd/beszel:0.21.1
    ports:
      # Not public: open it with `just beszel-tunnel` (an SSH tunnel).
      - 127.0.0.1:8090:8090
    env_file: env/beszel.env
    volumes:
      - ./data/beszel/hub:/beszel_data
      - ./data/beszel/socket:/beszel_socket
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 60s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  # Start it after `just beszel-setup`, which writes its KEY and TOKEN to
  # env/beszel-agent.env.
  beszel-agent:
    image: henrygd/beszel-agent:0.21.1
    # Host network: the agent reads the network of the host, and it reaches the
    # hub on 127.0.0.1:8090.
    network_mode: host
    env_file:
      - path: env/beszel-agent.env
        required: false
    environment:
      HUB_URL: http://127.0.0.1:8090
      # A unix socket instead of the TCP port 45876: the agent listens on no
      # network port.
      LISTEN: /beszel_socket/beszel.sock
    volumes:
      - ./data/beszel/agent:/var/lib/beszel-agent
      - ./data/beszel/socket:/beszel_socket
      # Read only, but the Docker socket still gives wide access to the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  # vmagent: it reads the metrics of the targets of vmagent/scrape.yaml (Caddy
  # and CrowdSec on the host, for now) and sends them to VictoriaMetrics, on
  # another server. While that server does not answer, it keeps them in
  # data/vmagent, and it sends them later.
  vmagent:
    image: victoriametrics/vmagent:v1.154.0
    # Host network: the targets listen on 127.0.0.1 of the host.
    network_mode: host
    # remoteWrite_url: the write URL of VictoriaMetrics. This public repository
    # does not hold the private address of that server.
    env_file: env/vmagent.env
    # -envflag.enable: vmagent also reads its flags from these variables.
    environment:
      # The host of the targets in vmagent/scrape.yaml.
      METRICS_HOST: 127.0.0.1
      # Not on all the addresses: with the host network, that includes the
      # public address of the VPS.
      httpListenAddr: 127.0.0.1:8429
    command:
      - -envflag.enable
      - -promscrape.config=/etc/vmagent/scrape.yaml
      - -remoteWrite.tmpDataPath=/vmagent-data
      - -remoteWrite.maxDiskUsagePerURL=1GB
      # A label on each metric: the machine that it comes from.
      - -remoteWrite.label=machine=hetzner
    volumes:
      - ./vmagent:/etc/vmagent:ro
      - ./data/vmagent:/vmagent-data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8429/health"]
      interval: 60s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped
    logging: *logging
